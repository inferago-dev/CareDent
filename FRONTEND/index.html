<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Logo_Badge.png is a 208 KB print-resolution asset; pointing the favicon
         at it meant every visitor downloaded it on every page. These are the
         same mark at the sizes each slot actually renders. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#172554" />

    <!-- Defaults. Per-route values are set at runtime by src/components/Seo.jsx
         and baked into each route's index.html by scripts/prerender-meta.mjs,
         so link scrapers that do not run JavaScript still get real metadata. -->
    <!-- seo:start -->
    <title>Dental Equipment Supplier &amp; Service in Chennai | Care Dent</title>
    <meta
      name="description"
      content="Care Dent supplies, installs and services dental chairs, X-ray units, compressors and autoclaves across India, with certified in-house engineers and stocked spares."
    />
    <link rel="canonical" href="https://www.caredent.net/" />

    <meta property="og:site_name" content="Care Dent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dental Equipment Supplier &amp; Service in Chennai | Care Dent" />
    <meta
      property="og:description"
      content="Care Dent supplies, installs and services dental chairs, X-ray units, compressors and autoclaves across India, with certified in-house engineers and stocked spares."
    />
    <meta property="og:url" content="https://www.caredent.net/" />
    <meta property="og:image" content="https://www.caredent.net/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Care Dent - dental equipment supply, installation and service in Chennai" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dental Equipment Supplier &amp; Service in Chennai | Care Dent" />
    <meta
      name="twitter:description"
      content="Care Dent supplies, installs and services dental chairs, X-ray units, compressors and autoclaves across India, with certified in-house engineers and stocked spares."
    />
    <meta name="twitter:image" content="https://www.caredent.net/og-card.png" />
    <meta name="twitter:image:alt" content="Care Dent - dental equipment supply, installation and service in Chennai" />
    <!-- seo:end -->

    <!-- Local search signals: these do not change per route. -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Chennai" />

    <link rel="preload" href="/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
